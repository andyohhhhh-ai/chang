plugins { id 'com.android.application' }

android {
 namespace 'com.example.longshot'
 compileSdk 35
 defaultConfig {
  applicationId 'com.example.longshot'
  minSdk 23
  targetSdk 35
  versionCode 3
  versionName '1.0.2'
 }
 androidComponents {
  onVariants(selector().all()) { variant ->
   variant.outputs.each { output -> output.outputFileName = "chang-longshot-2.apk" }
  }
}