// Version 1.0.4: sequential APK filename for easier installs.
plugins { id 'com.android.application' }

android {
 namespace 'com.example.longshot'
 compileSdk 35
 defaultConfig {
  applicationId 'com.example.longshot'
  minSdk 23
  targetSdk 35
  versionCode 5
  versionName '1.0.4'
 }
}

androidComponents {
 onVariants(selector().all()) { variant ->
  variant.outputs.each { output ->
   output.outputFileName.set("chang-longshot-4.apk")
  }
 }
}